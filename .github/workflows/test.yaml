name: Running IggyBot Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:22.19.0
    steps:
      - uses: actions/checkout@v3
        with:
          node-version:22.19.0
      - run: npm 
      - run: npm test